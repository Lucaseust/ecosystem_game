<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECOSYSTEM — tableau de bord</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
</head>
<body>

<div id="offline" class="offline" hidden>Connexion perdue — reconnexion…</div>

<div class="host-masthead"><div class="brand"><img src="/static/mark.svg" alt="" width="30" height="30"><b>ecosystem<span class="wordmark-dot">.</span></b></div><span>Votre espace de séance · Métropole, 2032</span></div>
<header class="host-head">
  <div class="qrbox"><img id="qr" alt="QR de connexion" width="132" height="132"></div>

  <div>
    <div class="host-sub">Les étudiants rejoignent sur</div>
    <div id="joinurl" class="host-title mono">—</div>
    <div class="host-sub" style="margin-top:.3rem">
      Partie <b id="code">—</b> · <b id="nplayers">0</b> joueurs connectés
    </div>
  </div>

  <div class="grow" style="min-width:220px">
    <div class="host-sub">Phase</div>
    <div id="phase" class="host-title">—</div>
    <div class="row wrapped phase-controls" style="margin-top:.4rem">
      <button class="small" onclick="host('prev')">◀ Précédent</button>
      <button class="small primary" onclick="host('next')">Suivant ▶</button>
      <select id="phasesel" style="width:auto;max-width:100%;min-height:34px;padding:.2rem .5rem"></select>
    </div>
  </div>

  <div class="center">
    <div id="timer" class="timer">—</div>
    <div class="row" style="margin-top:.4rem;justify-content:center">
      <button class="small" id="btnplay" aria-label="Démarrer ou mettre en pause le chronomètre" onclick="toggleTimer()">▶</button>
      <button class="small" aria-label="Réinitialiser le chronomètre" onclick="host('timer_reset')">↺</button>
      <button class="small" onclick="host('timer_add',{seconds:60})">+1 min</button>
    </div>
  </div>
</header>

<div class="host-actions" aria-label="Gestion des étudiants">
  <button id="manageStudents" class="small" onclick="manageStudents()">Retirer un étudiant</button>
  <button id="requestIdentity" class="small" onclick="requestIdentity()">Demander nom et prénom</button>
  <span class="small muted">Gestion de la classe</span>
</div>

<div class="tabs" style="margin:.8rem 0">
  <button id="tab-board"   aria-pressed="true"  onclick="setTab('board')">Écosystèmes</button>
  <button id="tab-players" aria-pressed="false" onclick="setTab('players')">Joueurs &amp; réglages</button>
  <button id="tab-final"   aria-pressed="false" onclick="setTab('final')">Classements</button>
  <button id="tab-brief"   aria-pressed="false" onclick="setTab('brief')">Débrief</button>
</div>

<main id="view" class="wide"></main>

<script src="/static/session.js"></script>
<script src="/static/hote.js"></script>
</body>
</html>
